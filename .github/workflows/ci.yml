name: CI

on:
  push:
    branches:
      - main
      - phase-1-express-foundation
  pull_request:
    branches:
      - main
      - phase-1-express-foundation

jobs:
  backend:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/shopping_market
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
