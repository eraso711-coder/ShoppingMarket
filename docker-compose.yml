services:
  postgres:
    image: postgres:17-alpine
    container_name: shopping_market_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_market
    ports:
      - "5432:5432"
    volumes:
      - shopping_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopping_market"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shopping_market_data:
