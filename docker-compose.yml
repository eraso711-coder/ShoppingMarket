services:
  postgres:
    image: postgres:17-alpine
    container_name: shopping_market_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-robertsanchez}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_DB: ${DB_NAME:-shopping_market}
    ports:
      - "5432:5432"
    volumes:
      - shopping_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopping_market_data:
