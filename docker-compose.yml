services:
  postgres:
    image: postgres:17-alpine
    container_name: shoppingmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoppingmarket}
      POSTGRES_USER: ${POSTGRES_USER:-shoppingmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppingmarket_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shoppingmarket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoppingmarket} -d ${POSTGRES_DB:-shoppingmarket}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shoppingmarket_postgres_data:
